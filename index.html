<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>alisa 🖤</title>
<meta name="robots" content="noindex">
<style>
  html, body { height: 100%; margin: 0; background: #17141a; color: #ece6f0;
    font-family: -apple-system, "Helvetica Neue", Arial, sans-serif; }
  body { display: flex; align-items: center; justify-content: center; }
  .hint { position: fixed; top: 0; left: 0; right: 0; background: #b32b6e; color: #fff0f6;
    font-size: 14px; font-weight: 700; text-align: center; padding: 12px 16px;
    transform: translateY(-110%); transition: transform .35s; }
  .hint.on { transform: none; }
  .dots { opacity: .5; font-size: 15px; }
</style>
</head>
<body>
<div class="hint" id="hint">tap ⋯ and choose “Open in external browser” 🖤</div>
<div class="dots">…</div>
<script>
  // Первый прыжок: выходим из встроенного браузера Instagram в настоящий,
  // и уже там открывается основная страница.
  var TARGET = "https://alisadiary.com/go/";
  (function () {
    var ua = navigator.userAgent || "";
    var bare = TARGET.replace(/^https?:\/\//, "");
    if (!/Instagram|FBAN|FBAV/i.test(ua)) { location.replace(TARGET); return; }
    if (/Android/i.test(ua)) {
      location.href = "intent://" + bare + "#Intent;scheme=https;package=com.android.chrome;end";
    } else if (/iPhone|iPad|iPod/i.test(ua)) {
      location.href = "x-safari-https://" + bare;
      setTimeout(function () { if (!document.hidden) location.href = "googlechromes://" + bare; }, 800);
    }
    // Не вышло выйти — показываем подсказку и всё равно открываем основную страницу здесь.
    setTimeout(function () {
      if (document.hidden) return;
      document.getElementById("hint").classList.add("on");
      setTimeout(function () { location.replace(TARGET); }, 1800);
    }, 1800);
  })();
</script>
</body>
</html>
