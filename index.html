<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>alisa1goth</title>
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --bg: #0d0d10;
    --card: #17171c;
    --accent: #e8536b;
    --text: #f2f0ee;
    --muted: #9a97a3;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 50% 0%, #22151c 0%, var(--bg) 55%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border-radius: 20px;
    padding: 36px 28px 28px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .avatar {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    margin: 0 auto 18px;
    background: linear-gradient(135deg, var(--accent), #7a3bff);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    font-weight: 700;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
    letter-spacing: 0.02em;
  }
  .tag {
    color: var(--muted);
    font-size: 14px;
    margin-bottom: 28px;
  }
  .btn {
    display: block;
    width: 100%;
    padding: 16px 20px;
    border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #c73a55);
    color: #fff;
    text-decoration: none;
    font-weight: 600;
    font-size: 16px;
    letter-spacing: 0.01em;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: 0 8px 24px rgba(232, 83, 107, 0.35);
  }
  .btn:active { transform: scale(0.98); }
  .foot {
    margin-top: 22px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">A</div>
    <h1>alisa1goth</h1>
    <div class="tag">exclusive content · new drops weekly</div>
    <a class="btn" href="https://linktery.com/nxka5fgwvk" target="_blank" rel="noopener">Open my page →</a>
    <div class="foot">18+ only</div>
  </div>
</body>
</html>
